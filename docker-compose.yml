services:
  mysql:
    image: mysql:8.0
    container_name: farmlink-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: farmlink
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-farmlink1234}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-farmlink1234}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: farmlink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: farmlink-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/farmlink?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-farmlink1234}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-도커로컬용임시시크릿값최소256비트이상충분히길게작성함}
    ports:
      - "8080:8080"

  # 프론트는 별도 저장소(../farmlink-frontend)라 build context를 상대경로로 지정.
  # 저장소 위치를 옮기면 이 경로도 같이 바꿔줘야 함.
  frontend:
    build:
      context: ../farmlink-frontend
    container_name: farmlink-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
