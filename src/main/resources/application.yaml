spring:
  application:
    name: farmlink

  datasource:
    url: jdbc:mysql://localhost:3306/farmlink?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:여기에긴랜덤문자열최소256비트필요함나중에env로뺄것}
  access-token-expiration: 1800000      # 30분 (ms)
  refresh-token-expiration: 604800000   # 7일 (ms)

# 자연어 질의응답(AI 어시스턴트) 기능용 Gemini API 설정
# GEMINI_API_KEY 환경변수로 실제 키를 주입할 것 (Google AI Studio에서 발급)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.0-flash

logging:
    level:
      org.springframework.security: DEBUG
